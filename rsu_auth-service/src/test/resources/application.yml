spring:
  application:
    name: rsu-auth-service-tests
  datasource:
    url: jdbc:h2:mem:rsu_auth_service_tests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: test-only-secret-with-at-least-32-bytes
      issuer: rsu-auth-service-tests
      expiration: PT1H

