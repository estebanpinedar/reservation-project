spring:
  application:
    name: rsu-auth-service
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:space_reservation}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration_mysql
    baseline-on-migrate: true
    baseline-version: 2

app:
  bootstrap-admin:
    name: ${APP_BOOTSTRAP_ADMIN_NAME:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      # This default is only suitable for local development. Set APP_SECURITY_JWT_SECRET in deployed environments.
      secret: ${APP_SECURITY_JWT_SECRET:local-development-secret-change-this-before-production-2026}
      issuer: rsu-auth-service
      expiration: PT1H
