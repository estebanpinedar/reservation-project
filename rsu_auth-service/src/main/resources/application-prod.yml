server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:space_reservation}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

app:
  web:
    allowed-origins: ${APP_WEB_ALLOWED_ORIGINS}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
    require-https: true
